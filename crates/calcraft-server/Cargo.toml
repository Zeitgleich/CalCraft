[package]
name = "calcraft-server"
description = "Self-hosted CalDAV/CardDAV server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "calcraft"
path = "src/main.rs"

[features]
default = ["web-ui", "api", "oidc"]
web-ui = ["dep:calcraft-web"]
api = []
# Single sign-on via OpenID Connect (outbound HTTPS client and JWT verification).
oidc = [
    "api",
    "dep:http-body-util",
    "dep:hyper-util",
    "dep:hyper-rustls",
    "dep:ring",
    "dep:rustls",
    "dep:rustls-native-certs",
]

[dependencies]
anyhow.workspace = true
argon2.workspace = true
axum.workspace = true
base64.workspace = true
blake3.workspace = true
bytes.workspace = true
calcraft-core.workspace = true
calcraft-dav.workspace = true
calcraft-ical.workspace = true
calcraft-store.workspace = true
calcraft-web = { workspace = true, optional = true }
clap.workspace = true
figment.workspace = true
getrandom.workspace = true
hmac.workspace = true
http-body-util = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true, features = ["client-legacy", "http1", "tokio"] }
hyper-rustls = { workspace = true, optional = true }
ring = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-native-certs = { workspace = true, optional = true }
rpassword.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
http-body-util.workspace = true
serde_json.workspace = true
tower.workspace = true

[lints]
workspace = true
