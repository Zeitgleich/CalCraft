[package]
name = "calcraft-server"
description = "Self-hosted CalDAV/CardDAV server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "calcraft"
path = "src/main.rs"

[features]
default = ["web-ui", "api", "oidc", "update-check", "migrate"]
web-ui = ["dep:calcraft-web"]
api = ["dep:futures-core"]
# Single sign-on via OpenID Connect (outbound HTTPS client and JWT verification).
oidc = ["api", "https-client", "dep:ring"]
# Optional update notice for administrators (`[updates] check`, off by
# default): fetches the latest release from GitHub.
update-check = ["api", "https-client"]
# `calcraft migrate`: copies calendars and address books from another
# CalDAV/CardDAV server (outbound HTTPS client, no new crates).
migrate = ["https-client", "dep:zeroize"]
# Outbound HTTPS client used by `oidc`, `update-check` and `migrate`; not
# useful alone.
https-client = [
    "dep:http-body-util",
    "dep:hyper-util",
    "dep:hyper-rustls",
    "dep:rustls",
    "dep:rustls-native-certs",
]

[dependencies]
anyhow.workspace = true
argon2.workspace = true
axum.workspace = true
base64.workspace = true
blake3.workspace = true
bytes.workspace = true
calcraft-core.workspace = true
calcraft-dav.workspace = true
calcraft-ical.workspace = true
calcraft-store.workspace = true
calcraft-web = { workspace = true, optional = true }
clap.workspace = true
figment.workspace = true
futures-core = { workspace = true, optional = true }
getrandom.workspace = true
hmac.workspace = true
http-body-util = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true, features = ["client-legacy", "http1", "tokio"] }
hyper-rustls = { workspace = true, optional = true }
ring = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-native-certs = { workspace = true, optional = true }
rpassword.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zeroize = { workspace = true, optional = true }

[dev-dependencies]
calcraft-store = { workspace = true, features = ["test-hooks"] }
http-body-util.workspace = true
serde_json.workspace = true
tower.workspace = true

[lints]
workspace = true
