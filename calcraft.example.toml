# CalCraft example configuration. Copy to calcraft.toml and adjust.
# Every key can be overridden via environment variables, e.g.
# CALCRAFT_SERVER__BIND=0.0.0.0:5232. Unknown keys are rejected.

[server]
# Listen on loopback only by default. Put a TLS-terminating reverse proxy in front.
bind = "127.0.0.1:5232"
# Maximum request body size in bytes (10 MiB).
max_body_bytes = 10485760
request_timeout_secs = 30
# Requests handled at the same time. Further requests are answered at once with
# 503 and Retry-After instead of being queued. /healthz and /readyz are exempt.
max_concurrent_requests = 256

# Per-client limits; the client is the TCP peer address, or the address from
# X-Forwarded-For if the peer is a trusted proxy (see trusted_proxies). Excess
# requests get 429 with Retry-After. Raise them if many users share one address
# (NAT, company network).
# Requests of one client handled at the same time.
max_concurrent_requests_per_client = 32
# Token bucket: a burst of up to client_rate_burst requests, then
# client_rate_per_second on average.
client_rate_burst = 120
client_rate_per_second = 20
# Failed logins (DAV, web UI, second factor) per client within 15 minutes, for
# known and unknown usernames alike. Afterwards every login from that client
# fails like a wrong password until the window ends. Applies in addition to
# the lockout per account (5 failures in 15 minutes).
max_login_failures_per_client = 20
# IPv6 clients are grouped by network of this prefix length (32 to 128).
client_ipv6_prefix = 64
# Most clients tracked at once; idle, then least recently seen entries are
# evicted beyond that, so memory stays bounded.
max_tracked_clients = 10000
# Reverse proxies whose X-Forwarded-For header is used (CIDR ranges or single
# addresses). The default trusts loopback, i.e. a reverse proxy on the same
# host. Trade-off: any local process can then send X-Forwarded-For and choose
# its client address (evade the per-client limits, or use up another
# address's failed logins). Set [] to never use the header, e.g. when nothing
# runs in front of CalCraft and untrusted local users exist. A proxy elsewhere
# (other host, Docker bridge) must be listed explicitly. CalCraft warns once
# when it receives X-Forwarded-For from a peer that is not listed.
# Only list proxies that append the address they received the request from
# (nginx: $proxy_add_x_forwarded_for, Apache mod_proxy: default). Otherwise
# clients can choose their address and evade the per-client limits.
trusted_proxies = ["127.0.0.1/32", "::1/128"]

[storage]
# SQLite database file, created with owner-only permissions on first start.
database = "calcraft.db"
# Before migrating an existing database at startup, write a backup
# <database>.pre-migration-<version>-<timestamp> next to it. If the backup
# fails, CalCraft does not migrate and does not start.
pre_migration_backup = true
# Number of pre-migration backups to keep (older ones are deleted).
pre_migration_backups_keep = 3
# Days deleted calendar objects, contacts and whole collections stay in the
# owner's trash (web UI "Trash", REST /api/v1/trash) before they are purged
# for good. Trash entries count towards the user's storage quota. Deleted
# data (and every backup taken meanwhile) is kept that long - keep this in
# mind for deletion requests (GDPR Art. 17); users can empty their trash.
# 0 disables the trash: deletions are final, and ALL entries still in the
# trash are purged at the next start (a warning with their number is
# logged). At most 3650.
trash_retention_days = 30

# Largest accepted vCard in bytes, including embedded contact photos. Unset:
# 2 MiB, or server.max_body_bytes if that is smaller. An explicit value must be
# between 65536 and 10485760 (10 MiB) and at most server.max_body_bytes; the
# reverse proxy must allow server.max_body_bytes. Calendar objects are limited
# to 1 MiB.
# max_vcard_bytes = 2097152

[security]
# Send Strict-Transport-Security. Enable only when CalCraft is served over HTTPS.
hsts = false
# Mark session cookies Secure (HTTPS only). Browsers accept them on http://localhost too.
secure_cookies = true
# Allow login with the account password (REST login and DAV Basic auth). false = SSO
# only (requires [oidc]); app passwords keep working.
password_login = true

[web_ui]
enabled = true

[api]
enabled = true

[oidc]
# Single sign-on for the web UI via OpenID Connect (Keycloak, Authentik, Zitadel, Entra ID, ...).
enabled = false
# Issuer exactly as in the ID token; discovery: <issuer>/.well-known/openid-configuration.
# issuer = "https://keycloak.example.com/realms/main"
# client_id = "calcraft"
# Prefer client_secret_file or CALCRAFT_OIDC__CLIENT_SECRET over client_secret.
# client_secret_file = "/run/secrets/calcraft-oidc"
# "client_secret_basic" (default), "client_secret_post" or "none" (public client).
# token_auth_method = "client_secret_basic"
# Must be registered at the IdP exactly like this.
# redirect_uri = "https://cal.example.com/api/v1/auth/oidc/callback"
# scopes = ["openid", "profile"]
# username_claim = "preferred_username"
# username_strip_suffix = "@example.com"
# Admin rights from a claim (dotted paths like "realm_access.roles" work).
# admin_claim = "groups"
# admin_value = "/calcraft-admins"
# Only users with this claim value may log in via SSO.
# required_claim = "groups"
# required_value = "/calcraft-users"
# auto_create_users = false
# Existing local accounts are only linked after
# `calcraft user allow-sso-link <user> --subject <IdP user ID>` (single use, 1 h default).
# Refuse SSO for accounts with local 2FA (default: rely on the IdP's MFA).
# require_local_totp = false
# signing_algs = ["RS256", "ES256"]
# clock_skew_secs = 30
# extra_endpoint_hosts = []
# ca_file = "/etc/calcraft/idp-ca.pem"
# button_label = "Single sign-on"

[updates]
# Show "New version X available" in the admin area. Off by default. When on, the
# server sends one GET to https://api.github.com/repos/Zeitgleich/CalCraft/releases/latest
# at startup and every interval_hours (no cookies, no credentials, no data about this
# installation); GitHub sees the server's IP address and User-Agent "calcraft/<version>".
check = false
# Hours between checks (1-168); a random delay of up to 10 % is added.
interval_hours = 24

[subscriptions]
# Calendar subscriptions (webcal/ICS feeds fetched by the server and shown as
# read-only calendars). Off by default: when on, the server sends requests to
# feed URLs its users enter - only to public addresses (private, loopback,
# link-local, metadata and similar addresses are refused, also after DNS
# resolution and redirects). Feed URLs may contain secret tokens; they are stored
# in the database and never logged (only the host).
enabled = false
# Also allow plain http:// feeds (webcal:// always means https).
allow_http = false
# Ports feeds may use; empty: 443, plus 80 if allow_http.
allowed_ports = []
# If not empty, only these hosts (also for redirects): "example.com" exactly,
# "*.example.com" any subdomain.
allowed_hosts = []
# Hosts that may never be subscribed to (same syntax).
denied_hosts = []
# Largest feed in bytes (64 KiB to 20 MiB).
max_bytes = 10485760
# Subscriptions per user (1-100).
max_per_user = 20
# Refresh interval if neither the user nor the feed sets one, in minutes
# (15-10080); a feed's REFRESH-INTERVAL/X-PUBLISHED-TTL is used within these bounds.
default_refresh_minutes = 360
# Feeds fetched at the same time (1-16).
max_concurrent_fetches = 2
# Deadline for one fetch including redirects and the body, in seconds (5-120).
timeout_secs = 30
# Redirects followed per fetch (0-5); every hop is checked again.
max_redirects = 3

[scheduling]
# CalDAV scheduling (RFC 6638) between users of this server: invitations,
# replies and cancellations are delivered by the server, and users can look up
# each other's busy times. Off by default. Invitations to addresses outside this
# server are not sent (no e-mail yet). See docs/scheduling.md.
enabled = false
# Give every user the address mailto:<username>@<domain> (in addition to an
# e-mail address set by an administrator: calcraft user set-email). Lower-case
# host name; unset: only e-mail addresses and principal URLs.
# domain = "example.org"
# Let users look up other users' free/busy time (busy periods only).
free_busy = true
# Distinct attendees of one scheduled event (1-1000).
max_attendees = 100
# Recipients one user may reach per hour: invitations, cancellations, replies
# and free/busy lookups (1-100000). Beyond that nothing is delivered (5.1).
max_recipients_per_hour = 1000
# Messages kept in each scheduling inbox (10-100000); the oldest are dropped.
inbox_max_messages = 1000
# Longest free/busy lookup in days (1-1830).
max_freebusy_days = 366
# Bytes of invitations (calendar copies plus inbox messages) one user may receive
# per hour from all senders together (64 KiB to 1 GiB); beyond: not delivered.
max_delivered_bytes_per_hour = 16777216
# Largest calendar copy delivered to an attendee (4 KiB to 1 MiB).
max_delivered_object_bytes = 262144

[logging]
# Filter syntax of tracing-subscriber; RUST_LOG takes precedence.
level = "info"
# "pretty" or "json"
format = "pretty"
