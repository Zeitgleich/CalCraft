# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# Every ignored advisory needs a reason and an issue link.
ignore = [
    # `paste` (compile-time proc macro, no runtime code) is archived. It is
    # only pulled in by Leptos (either_of) for the wasm web UI (calcraft-ui);
    # no vulnerability. Remove once Leptos switches to a maintained fork.
    # https://rustsec.org/advisories/RUSTSEC-2024-0436
    { id = "RUSTSEC-2024-0436", reason = "unmaintained proc macro used by Leptos, not a vulnerability" },
]

[licenses]
confidence-threshold = 0.93
allow = [
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # xxhash-rust, via Leptos (server_fn); permissive, AGPL-compatible.
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
