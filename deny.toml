# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# Every ignored advisory needs a reason and an issue link.
ignore = []

[licenses]
confidence-threshold = 0.93
allow = [
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Single XML parser rule: all XML (DAV bodies, xCal) goes through
# calcraft_ical::xml on top of quick-xml. No second XML parser.
deny = [
    { name = "xml-rs" },
    { name = "xml5ever" },
    { name = "roxmltree" },
    { name = "xmltree" },
    { name = "libxml" },
    { name = "sxd-document" },
    { name = "minidom" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
