name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo fmt --all --check

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features
      - name: Clippy (DAV only)
        run: cargo clippy -p calcraft-server --all-targets --no-default-features
      - name: Test (all features)
        run: cargo test --workspace --all-features
      - name: Test (DAV only)
        run: cargo test -p calcraft-server --no-default-features
      - name: Build wasm-compatible crates
        run: cargo check -p calcraft-core -p calcraft-ical -p calcraft-ui --target wasm32-unknown-unknown

  web-ui:
    name: web UI (wasm)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Must match the wasm-bindgen version pinned in crates/calcraft-ui/Cargo.toml.
      WASM_BINDGEN_VERSION: 0.2.114
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install wasm-bindgen CLI
        # Third-party code: do not fail on its warnings.
        env:
          RUSTFLAGS: ""
        run: |
          if [ "$(wasm-bindgen --version 2>/dev/null)" != "wasm-bindgen $WASM_BINDGEN_VERSION" ]; then
            cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked --force
          fi
      - name: Clippy (wasm)
        run: cargo clippy -p calcraft-ui --target wasm32-unknown-unknown --all-targets
      - name: Build UI assets
        run: scripts/build-ui.sh
      - name: Test server with embedded UI
        env:
          CALCRAFT_UI_REQUIRED: "1"
        run: cargo test -p calcraft-server --all-features

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources

  compat:
    name: client compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build server
        run: cargo build -p calcraft-server
      - name: Start server with a test user
        env:
          CALCRAFT_STORAGE__DATABASE: ${{ runner.temp }}/compat.db
        run: |
          echo "compat test password" | target/debug/calcraft user add alice --password-stdin
          target/debug/calcraft serve --bind 127.0.0.1:5232 > "$RUNNER_TEMP/server.log" 2>&1 &
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:5232/readyz && break; sleep 1; done
      - name: python-caldav session
        env:
          CALCRAFT_URL: http://127.0.0.1:5232
          CALCRAFT_USER: alice
          CALCRAFT_PASSWORD: compat test password
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet -r tests/compat/requirements.txt
          "$RUNNER_TEMP/venv/bin/python" tests/compat/caldav_client.py
      - name: Start a second server with scheduling and two users
        env:
          CALCRAFT_STORAGE__DATABASE: ${{ runner.temp }}/scheduling.db
          CALCRAFT_SCHEDULING__ENABLED: "true"
          CALCRAFT_SCHEDULING__DOMAIN: example.org
        run: |
          for user in alice bob; do
            echo "compat test password" | target/debug/calcraft user add "$user" --password-stdin
          done
          target/debug/calcraft serve --bind 127.0.0.1:5233 > "$RUNNER_TEMP/scheduling.log" 2>&1 &
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:5233/readyz && break; sleep 1; done
      - name: python-caldav scheduling session
        env:
          CALCRAFT_URL: http://127.0.0.1:5233
          CALCRAFT_PASSWORD: compat test password
        run: |
          "$RUNNER_TEMP/venv/bin/python" tests/compat/scheduling_client.py
      - name: python-caldav sharing session
        env:
          CALCRAFT_URL: http://127.0.0.1:5233
          CALCRAFT_PASSWORD: compat test password
        run: |
          "$RUNNER_TEMP/venv/bin/python" tests/compat/sharing_client.py
      - name: Scheduling server log
        if: always()
        run: cat "$RUNNER_TEMP/scheduling.log" || true
      - name: Server log
        if: always()
        run: cat "$RUNNER_TEMP/server.log"

  backup:
    name: backup/restore smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build server
        run: cargo build -p calcraft-server
      - name: Upgrade test (database of every older migration state -> current)
        run: cargo test -p calcraft-store upgrade_from_every_previous_migration
      - name: Backup, delete, restore with the real binary
        env:
          CALCRAFT_STORAGE__DATABASE: ${{ runner.temp }}/smoke/calcraft.db
        run: scripts/backup-smoke-test.sh target/debug/calcraft "$RUNNER_TEMP/smoke"
      - name: Server log
        if: always()
        run: cat "$RUNNER_TEMP/smoke/server.log" || true

  systemd:
    name: systemd service
    # GitHub's Ubuntu runners boot with systemd as PID 1.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Debug build without embedded UI: the service behaviour is the same.
      - name: Build server
        run: cargo build -p calcraft-server
      - name: Install and test the systemd service (contrib/systemd)
        shell: bash
        run: |
          set -euo pipefail
          sudo scripts/systemd-test.sh "$PWD/target/debug/calcraft"
      - name: Service log
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          sudo systemctl status calcraft.service --no-pager --full || true
          sudo journalctl --unit=calcraft.service --no-pager --output=short-precise || true

  fuzz:
    name: fuzz (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install nightly and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo +nightly install cargo-fuzz --locked --version 0.13.2
      - name: Fuzz each target for 60 seconds
        shell: bash
        run: |
          set -euo pipefail
          for target in ical_object dav_xml recurrence import itip attach; do
            # Checked-in seeds (fuzz/seeds/<target>) start the corpus.
            mkdir -p "fuzz/corpus/$target"
            if [ -d "fuzz/seeds/$target" ]; then cp fuzz/seeds/"$target"/* "fuzz/corpus/$target/"; fi
            cargo +nightly fuzz run "$target" -- -max_total_time=60 -rss_limit_mb=1024
          done
