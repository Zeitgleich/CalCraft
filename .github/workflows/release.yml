name: Release

# A pushed tag vX.Y.Z (or vX.Y.Z-pre) builds, attests and publishes a
# release. workflow_dispatch is a dry run: it builds and packages everything
# (binaries, archives, SHA256SUMS, Docker images) but publishes nothing – no
# attestations, no image push, no GitHub release.
# Verification for users: docs/release-verification.md. Maintainer
# checklist: docs/releasing.md.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/zeitgleich/calcraft

jobs:
  meta:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      publish: ${{ steps.version.outputs.publish }}
      docker-tags: ${{ steps.version.outputs.docker-tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Determine version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          crate=$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "calcraft-server") | .version')
          if [ "$EVENT" = push ] && [ "$REF_TYPE" = tag ]; then
            if ! printf '%s\n' "$REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
              echo "::error::tag $REF_NAME is not vMAJOR.MINOR.PATCH[-PRERELEASE]"
              exit 1
            fi
            version=${REF_NAME#v}
            if [ "$version" != "$crate" ]; then
              echo "::error::tag $REF_NAME does not match the workspace version $crate in Cargo.toml"
              exit 1
            fi
            publish=true
          else
            version=$crate
            publish=false
          fi
          case "$version" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          major_minor=$(printf '%s\n' "$version" | cut -d. -f1-2)
          tags="$IMAGE:$version"
          if [ "$prerelease" = false ]; then
            tags="$tags,$IMAGE:$major_minor,$IMAGE:latest"
          fi
          {
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "publish=$publish"
            echo "docker-tags=$tags"
          } >> "$GITHUB_OUTPUT"
          echo "version $version, prerelease $prerelease, publish $publish, image tags $tags"

  ui:
    name: web UI assets
    runs-on: ubuntu-latest
    env:
      # Must match the wasm-bindgen version pinned in crates/calcraft-ui/Cargo.toml.
      WASM_BINDGEN_VERSION: 0.2.114
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No rust-cache in release builds: everything is built from scratch.
      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked
      - name: Build UI assets
        run: scripts/build-ui.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-dist
          path: crates/calcraft-ui/dist
          if-no-files-found: error
          retention-days: 3

  binaries:
    name: binary (${{ matrix.target }})
    needs: [meta, ui]
    strategy:
      fail-fast: true
      matrix:
        include:
          # Ubuntu 22.04: glibc 2.35, so the binaries also run on Debian 12
          # and Ubuntu 22.04. Native runners for both architectures.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          # Last Intel macOS runner image (macos-13 is retired).
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-dist
          path: crates/calcraft-ui/dist
      - name: Build
        shell: bash
        env:
          CALCRAFT_UI_REQUIRED: "1"
        run: |
          rustup target add "$TARGET"
          cargo build --release --locked -p calcraft-server --target "$TARGET"
      - name: Package (tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="calcraft-$VERSION-$TARGET"
          mkdir -p "pkg/$name" out
          cp "target/$TARGET/release/calcraft" LICENSE README.md calcraft.example.toml "pkg/$name/"
          tar -C pkg -czf "out/$name.tar.gz" "$name"
          "pkg/$name/calcraft" --version
      - name: Package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "calcraft-$env:VERSION-$env:TARGET"
          New-Item -ItemType Directory -Force -Path "pkg/$name", "out" | Out-Null
          Copy-Item "target/$env:TARGET/release/calcraft.exe", LICENSE, README.md, calcraft.example.toml -Destination "pkg/$name/"
          Compress-Archive -Path "pkg/$name" -DestinationPath "out/$name.zip"
          & "pkg/$name/calcraft.exe" --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-${{ matrix.target }}
          path: out/*
          if-no-files-found: error
          retention-days: 7

  checksums:
    name: checksums and provenance
    needs: [meta, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: dist
        run: |
          sha256sum calcraft-* > SHA256SUMS
          cat SHA256SUMS
      - name: Attest build provenance (archives and SHA256SUMS)
        if: needs.meta.outputs.publish == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/calcraft-*
            dist/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  # One native runner per architecture: a Rust release build (fat LTO) under
  # QEMU emulation takes hours and regularly times out. Each job pushes its
  # image by digest only; docker-manifest joins them into one tagged index.
  docker:
    name: docker (${{ matrix.platform }})
    needs: [meta]
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            os: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to ghcr.io
        if: needs.meta.outputs.publish == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push by digest)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=https://github.com/Zeitgleich/CalCraft
            org.opencontainers.image.version=${{ needs.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          outputs: ${{ needs.meta.outputs.publish == 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) || 'type=cacheonly' }}
      - name: Export digest
        if: needs.meta.outputs.publish == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - if: needs.meta.outputs.publish == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-manifest:
    name: docker manifest, signature and provenance
    needs: [meta, docker]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push the multi-arch index
        id: index
        env:
          TAGS: ${{ needs.meta.outputs.docker-tags }}
          VERSION: ${{ needs.meta.outputs.version }}
        working-directory: ${{ runner.temp }}/digests
        run: |
          set --
          for tag in $(printf '%s' "$TAGS" | tr ',' ' '); do
            set -- "$@" --tag "$tag"
          done
          for digest in *; do
            set -- "$@" "$IMAGE@sha256:$digest"
          done
          docker buildx imagetools create "$@"
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "index $IMAGE@$digest"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image (cosign keyless)
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: Attest build provenance (image)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

  release:
    name: GitHub release
    needs: [meta, checksums, docker-manifest]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.meta.outputs.version }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          ## Verification

          Every archive and \`SHA256SUMS\` carry a build provenance attestation;
          the Docker image is signed with cosign (keyless) and attested.
          Details: [docs/release-verification.md](https://github.com/Zeitgleich/CalCraft/blob/$TAG/docs/release-verification.md)

          \`\`\`sh
          sha256sum --ignore-missing -c SHA256SUMS
          gh attestation verify calcraft-$VERSION-x86_64-unknown-linux-gnu.tar.gz --repo Zeitgleich/CalCraft
          gh attestation verify oci://$IMAGE:$VERSION --repo Zeitgleich/CalCraft
          cosign verify $IMAGE:$VERSION \\
            --certificate-identity "https://github.com/Zeitgleich/CalCraft/.github/workflows/release.yml@refs/tags/$TAG" \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          \`\`\`
          EOF
          set -- --verify-tag --title "CalCraft $VERSION" --generate-notes --notes-file "$RUNNER_TEMP/notes.md"
          if [ "$PRERELEASE" = true ]; then
            set -- "$@" --prerelease
          else
            set -- "$@" --latest
          fi
          gh release create "$TAG" "$@" dist/*
