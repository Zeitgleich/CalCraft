[package]
name = "calcraft-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
calcraft-core = { path = "../crates/calcraft-core" }
calcraft-dav = { path = "../crates/calcraft-dav" }
calcraft-ical = { path = "../crates/calcraft-ical" }

# Not part of the main workspace: fuzzing needs a nightly toolchain.
[workspace]

[[bin]]
name = "ical_object"
path = "fuzz_targets/ical_object.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dav_xml"
path = "fuzz_targets/dav_xml.rs"
test = false
doc = false
bench = false

[[bin]]
name = "import"
path = "fuzz_targets/import.rs"
test = false
doc = false
bench = false

[[bin]]
name = "recurrence"
path = "fuzz_targets/recurrence.rs"
test = false
doc = false
bench = false

[[bin]]
name = "itip"
path = "fuzz_targets/itip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "attach"
path = "fuzz_targets/attach.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mail"
path = "fuzz_targets/mail.rs"
test = false
doc = false
bench = false
