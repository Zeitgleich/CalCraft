[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/calcraft-server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Zeitgleich/CalCraft"
homepage = "https://github.com/Zeitgleich/CalCraft"
authors = ["CalCraft contributors"]

[workspace.dependencies]
calcraft-core = { path = "crates/calcraft-core", version = "0.1.0" }
calcraft-ical = { path = "crates/calcraft-ical", version = "0.1.0" }
calcraft-dav = { path = "crates/calcraft-dav", version = "0.1.0" }
calcraft-store = { path = "crates/calcraft-store", version = "0.1.0" }
calcraft-api = { path = "crates/calcraft-api", version = "0.1.0" }
calcraft-web = { path = "crates/calcraft-web", version = "0.1.0" }

anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "http2", "json", "tokio", "tracing", "query"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
figment = { version = "0.10.19", features = ["toml", "env"] }
http-body-util = "0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["trace", "timeout", "limit", "catch-panic"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
overflow-checks = true
