[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/calcraft-server"]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.94"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Zeitgleich/CalCraft"
homepage = "https://github.com/Zeitgleich/CalCraft"
authors = ["CalCraft contributors"]

[workspace.dependencies]
calcraft-core = { path = "crates/calcraft-core", version = "0.1.0-alpha.1" }
calcraft-ical = { path = "crates/calcraft-ical", version = "0.1.0-alpha.1" }
calcraft-dav = { path = "crates/calcraft-dav", version = "0.1.0-alpha.1" }
calcraft-store = { path = "crates/calcraft-store", version = "0.1.0-alpha.1" }
calcraft-web = { path = "crates/calcraft-web", version = "0.1.0-alpha.1" }

anyhow = "1.0.104"
argon2 = { version = "0.6.0", features = ["zeroize"] }
base64 = "0.23.1"
blake3 = "1.8.7"
bytes = "1"
quick-xml = "0.42.0"
getrandom = "0.4.3"
hmac = "0.13.0"
rpassword = "7.5.4"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "migrate", "macros"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "http2", "json", "tokio", "tracing", "query"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
figment = { version = "0.10.19", features = ["toml", "env"] }
futures-core = "0.3.34"
http-body-util = "0.1"
hyper-util = { version = "0.1.21", default-features = false }
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "ring", "tls12"] }
ring = "0.17.14"
rustls-native-certs = "0.8.5"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha1 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["trace", "timeout", "limit", "catch-panic"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
overflow-checks = true

# Web UI assets (scripts/build-ui.sh): optimised for size.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
